name: publish

# Publishes to npm using Trusted Publishing (OIDC) — no long-lived tokens.
# Requires a Trusted Publisher configured on npmjs.com for this package with
# workflow filename "publish.yml". Provenance is generated automatically.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Reference a protected environment to gate publishing (configure required
    # reviewers in the repo's Settings → Environments). If unset, GitHub creates
    # it automatically without protection.
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi
      - run: npm publish
